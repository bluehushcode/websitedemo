<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>a question ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      width: 100%;
      background: #0d0d0f;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    canvas#stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 10;
      background: rgba(255,255,255,0.03);
      border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      padding: 3.5rem 4rem;
      text-align: center;
      max-width: 500px;
      width: 90vw;
      backdrop-filter: blur(12px);
    }

    .question {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      font-weight: 400;
      color: #fff;
      line-height: 1.4;
      margin-bottom: 0.6rem;
    }

    .question em {
      font-style: italic;
      color: #c9a7f0;
    }

    .sub {
      font-size: 12px;
      color: rgba(255,255,255,0.25);
      margin-bottom: 2.75rem;
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
    }

    .btn-yes {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      padding: 0.8rem 2.5rem;
      border-radius: 100px;
      border: none;
      background: linear-gradient(135deg, #c9a7f0, #8b5cf6);
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.03em;
    }

    .btn-yes:hover {
      transform: scale(1.06);
      box-shadow: 0 0 32px rgba(139,92,246,0.5);
    }

    .btn-no {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      padding: 0.8rem 2.5rem;
      border-radius: 100px;
      border: 0.5px solid rgba(255,255,255,0.15);
      background: transparent;
      color: rgba(255,255,255,0.35);
      cursor: pointer;
      letter-spacing: 0.03em;
      white-space: nowrap;
      transition: top 0.12s cubic-bezier(0.22,1,0.36,1), left 0.12s cubic-bezier(0.22,1,0.36,1), font-size 0.2s ease;
    }

    .btn-no.escaped {
      position: fixed;
      z-index: 9999;
    }

    .success-view {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .heart-big {
      font-size: 4rem;
      line-height: 1;
      animation: heartbeat 0.85s ease infinite alternate;
      color: #c9a7f0;
    }

    @keyframes heartbeat {
      from { transform: scale(1); }
      to   { transform: scale(1.14); }
    }

    .success-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #fff;
      font-style: italic;
    }

    .success-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.3);
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    .confetti-dot {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    .card-enter {
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="card card-enter">
  <div id="questionView">
    <h1 class="question">Will you be <em>mine</em><br>forever honeybun?</h1>
    <p class="sub">think carefully. ✨</p>
    <div class="btn-group">
      <button class="btn-yes" id="yesBtn">Yes, obviously</button>
      <button class="btn-no" id="noBtn">No</button>
    </div>
  </div>
  <div class="success-view" id="successView">
    <div class="heart-big">♡</div>
    <p class="success-title">lol. you had no choice.</p>
    <p class="success-sub">thank u tho, I love you.</p>
  </div>
</div>

<script>
  /* Starfield */
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const dots = Array.from({ length: 100 }, () => ({
    x:     Math.random() * window.innerWidth,
    y:     Math.random() * window.innerHeight,
    r:     Math.random() * 1.3 + 0.2,
    speed: Math.random() * 0.004 + 0.001,
    phase: Math.random() * Math.PI * 2
  }));

  function animateStars(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    dots.forEach(d => {
      const alpha = 0.1 + 0.4 * Math.abs(Math.sin(t * d.speed + d.phase));
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(210,185,255,${alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(animateStars);
  }
  requestAnimationFrame(animateStars);

  /* No button */
  const noBtn  = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  let escaped       = false;
  let noHoverCount  = 0;
  let noBtnFontSize = 15;
  let curX = 0, curY = 0; // track current fixed position

  function escapeNoBtn() {
    noHoverCount++;
    noBtnFontSize = Math.max(10, 15 - noHoverCount * 0.5);
    noBtn.style.fontSize = noBtnFontSize + 'px';

    const btnW = noBtn.offsetWidth;
    const btnH = noBtn.offsetHeight;
    const pad  = 16;

    if (!escaped) {
      // First escape: grab current screen position, switch to fixed there, then jump
      escaped = true;
      const r = noBtn.getBoundingClientRect();
      curX = r.left;
      curY = r.top;
      noBtn.classList.add('escaped');
      noBtn.style.left = curX + 'px';
      noBtn.style.top  = curY + 'px';
    }

    // Jump to a new spot that is guaranteed fully on screen
    // Try up to 10 candidates, pick one far enough from current pos
    const minDist = 120;
    let nx, ny, attempts = 0;
    do {
      nx = pad + Math.random() * (window.innerWidth  - btnW - pad * 2);
      ny = pad + Math.random() * (window.innerHeight - btnH - pad * 2);
      attempts++;
    } while (
      attempts < 10 &&
      Math.hypot(nx - curX, ny - curY) < minDist
    );

    curX = nx;
    curY = ny;
    noBtn.style.left = nx + 'px';
    noBtn.style.top  = ny + 'px';
  }

  noBtn.addEventListener('mouseover',  escapeNoBtn);
  noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); escapeNoBtn(); }, { passive: false });

  /* Confetti */
  function spawnConfetti() {
    const colors = ['#c9a7f0','#8b5cf6','#f0c9e8','#ffffff','#d4b8ff','#e8d5ff'];
    for (let i = 0; i < 50; i++) {
      const dot = document.createElement('div');
      dot.className = 'confetti-dot';
      dot.style.left              = (10 + Math.random() * 80) + 'vw';
      dot.style.top               = '-12px';
      dot.style.background        = colors[Math.floor(Math.random() * colors.length)];
      dot.style.width             = (4 + Math.random() * 5) + 'px';
      dot.style.height            = dot.style.width;
      dot.style.animationDuration = (0.9 + Math.random() * 1.5) + 's';
      dot.style.animationDelay    = (Math.random() * 0.6) + 's';
      document.body.appendChild(dot);
      setTimeout(() => dot.remove(), 3200);
    }
  }

  /* Yes button */
  yesBtn.addEventListener('click', () => {
    document.getElementById('questionView').style.display = 'none';
    const sv = document.getElementById('successView');
    sv.style.display = 'flex';
    noBtn.style.display = 'none';
    spawnConfetti();
    setTimeout(spawnConfetti, 500);
    setTimeout(spawnConfetti, 1100);
  });
</script>
</body>
</html>
