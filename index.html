<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>a question ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      width: 100%;
      background: #0d0d0f;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    canvas#stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 10;
      background: rgba(255,255,255,0.03);
      border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      padding: 3.5rem 4rem;
      text-align: center;
      max-width: 500px;
      width: 90vw;
      backdrop-filter: blur(12px);
    }

    .question {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      font-weight: 400;
      color: #fff;
      line-height: 1.4;
      margin-bottom: 0.6rem;
    }

    .question em {
      font-style: italic;
      color: #c9a7f0;
    }

    .sub {
      font-size: 12px;
      color: rgba(255,255,255,0.25);
      margin-bottom: 2.75rem;
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
    }

    .btn-yes {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      padding: 0.8rem 2.5rem;
      border-radius: 100px;
      border: none;
      background: linear-gradient(135deg, #c9a7f0, #8b5cf6);
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.03em;
      position: relative;
      z-index: 10;
    }

    .btn-yes:hover {
      transform: scale(1.06);
      box-shadow: 0 0 32px rgba(139,92,246,0.5);
    }

    /* placeholder keeps the card layout stable after No goes fixed */
    #noPlaceholder {
      display: inline-block;
      width: 90px;
      height: 45px;
      flex-shrink: 0;
    }

    #noBtn {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      padding: 0.8rem 2.5rem;
      border-radius: 100px;
      border: 0.5px solid rgba(255,255,255,0.15);
      background: transparent;
      color: rgba(255,255,255,0.35);
      cursor: pointer;
      letter-spacing: 0.03em;
      white-space: nowrap;
      position: fixed;
      z-index: 9999;
      /* smooth glide */
      transition: left 0.13s cubic-bezier(0.22,1,0.36,1),
                  top  0.13s cubic-bezier(0.22,1,0.36,1);
    }

    .success-view {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .heart-big {
      font-size: 4rem;
      line-height: 1;
      animation: heartbeat 0.85s ease infinite alternate;
      color: #c9a7f0;
    }

    @keyframes heartbeat {
      from { transform: scale(1); }
      to   { transform: scale(1.14); }
    }

    .success-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #fff;
      font-style: italic;
    }

    .success-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.3);
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    .confetti-dot {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    .card-enter {
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="card card-enter">
  <div id="questionView">
    <h1 class="question">Will you be <em>mine</em><br>forever honeybun?</h1>
    <p class="sub">think carefully. ✨</p>
    <div class="btn-group">
      <button class="btn-yes" id="yesBtn">Yes, obviously</button>
      <div id="noPlaceholder"></div>
    </div>
  </div>
  <div class="success-view" id="successView">
    <div class="heart-big">♡</div>
    <p class="success-title">lol. you had no choice.</p>
    <p class="success-sub">thank u tho, I love you.</p>
  </div>
</div>

<!-- No button lives outside the card so fixed positioning is clean -->
<button id="noBtn">No</button>

<script>
  /* ── Starfield ── */
  const canvas = document.getElementById('stars');
  const ctx    = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', () => { resizeCanvas(); snapNoToPlaceholder(); });

  const dots = Array.from({ length: 100 }, () => ({
    x:     Math.random() * window.innerWidth,
    y:     Math.random() * window.innerHeight,
    r:     Math.random() * 1.3 + 0.2,
    speed: Math.random() * 0.004 + 0.001,
    phase: Math.random() * Math.PI * 2
  }));

  function animateStars(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    dots.forEach(d => {
      const alpha = 0.1 + 0.4 * Math.abs(Math.sin(t * d.speed + d.phase));
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(210,185,255,${alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(animateStars);
  }
  requestAnimationFrame(animateStars);

  /* ── No button ── */
  const noBtn      = document.getElementById('noBtn');
  const yesBtn     = document.getElementById('yesBtn');
  const placeholder = document.getElementById('noPlaceholder');

  let hasEscaped   = false;
  let noHoverCount = 0;
  let curX = 0, curY = 0;

  // Align No button over the placeholder on load
  function snapNoToPlaceholder() {
    if (hasEscaped) return;
    const r = placeholder.getBoundingClientRect();
    noBtn.style.left = r.left + 'px';
    noBtn.style.top  = r.top  + 'px';
    curX = r.left;
    curY = r.top;
  }

  // Wait for fonts/layout then snap
  window.addEventListener('load', snapNoToPlaceholder);
  setTimeout(snapNoToPlaceholder, 80);

  function safeMove() {
    // Button dimensions (read fresh each time)
    const btnW = noBtn.offsetWidth  || 90;
    const btnH = noBtn.offsetHeight || 45;
    const pad  = 24; // never closer than 24px to any edge

    const maxX = window.innerWidth  - btnW - pad;
    const maxY = window.innerHeight - btnH - pad;

    // Pick a new position that is meaningfully different but not too far
    const jumpRange = 220; // max pixels to jump per escape
    const minDist   = 80;  // must move at least this far

    let nx, ny, dist, tries = 0;
    do {
      const angle = Math.random() * Math.PI * 2;
      const dist2 = minDist + Math.random() * (jumpRange - minDist);
      nx = curX + Math.cos(angle) * dist2;
      ny = curY + Math.sin(angle) * dist2;
      // clamp strictly inside safe zone
      nx = Math.max(pad, Math.min(maxX, nx));
      ny = Math.max(pad, Math.min(maxY, ny));
      dist = Math.hypot(nx - curX, ny - curY);
      tries++;
    } while (dist < minDist && tries < 15);

    curX = nx;
    curY = ny;
    noBtn.style.left = nx + 'px';
    noBtn.style.top  = ny + 'px';
  }

  function escapeNoBtn() {
    if (!hasEscaped) {
      hasEscaped = true;
      // Disable the glide transition for the very first jump so it feels instant
      noBtn.style.transition = 'none';
      snapNoToPlaceholder(); // lock current position before switching
      requestAnimationFrame(() => {
        // Re-enable smooth glide for all subsequent hops
        noBtn.style.transition = 'left 0.13s cubic-bezier(0.22,1,0.36,1), top 0.13s cubic-bezier(0.22,1,0.36,1)';
        safeMove();
      });
    } else {
      safeMove();
    }

    noHoverCount++;
  }

  noBtn.addEventListener('mouseover',  escapeNoBtn);
  noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); escapeNoBtn(); }, { passive: false });

  /* ── Confetti ── */
  function spawnConfetti() {
    const colors = ['#c9a7f0','#8b5cf6','#f0c9e8','#ffffff','#d4b8ff','#e8d5ff'];
    for (let i = 0; i < 50; i++) {
      const dot = document.createElement('div');
      dot.className               = 'confetti-dot';
      dot.style.left              = (10 + Math.random() * 80) + 'vw';
      dot.style.top               = '-12px';
      dot.style.background        = colors[Math.floor(Math.random() * colors.length)];
      const size                  = (4 + Math.random() * 5) + 'px';
      dot.style.width             = size;
      dot.style.height            = size;
      dot.style.animationDuration = (0.9 + Math.random() * 1.5) + 's';
      dot.style.animationDelay    = (Math.random() * 0.6) + 's';
      document.body.appendChild(dot);
      setTimeout(() => dot.remove(), 3200);
    }
  }

  /* ── Yes button ── */
  yesBtn.addEventListener('click', () => {
    document.getElementById('questionView').style.display = 'none';
    document.getElementById('successView').style.display  = 'flex';
    noBtn.style.display = 'none';
    spawnConfetti();
    setTimeout(spawnConfetti, 500);
    setTimeout(spawnConfetti, 1100);
  });
</script>
</body>
</html>
